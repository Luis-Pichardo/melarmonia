# Comprobaciones automáticas en cada pull request y en main.
name: Comprobaciones

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Estilo del código
        run: npm run lint
      - name: Pruebas
        run: npm test -- --ci
